services:
  secretswithapikey:
    build: .
    container_name: secretswithapikey
    image: secrets:latest
    ports:
      - "3000:3000"
    secrets:
      - apikey.txt
    configs:
      - source: appconfig.json
        target: /run/configs/appconfig.json
    environment:
      - API_KEY_FILE=/run/secrets/apikey.txt
      - CONFIG_FILE=/run/configs/appconfig.json
      - SOURCE="environment variable"
    restart: unless-stopped

  secretswithoutapikey:
    build: .
    container_name: secretswithoutapikey
    image: secrets:latest
    ports:
      - "3001:3000"
    configs:
      - source: appconfig.json
        target: /run/configs/appconfig.json
    environment:
      - API_KEY_FILE=/run/secrets/apikey.txt
      - CONFIG_FILE=/run/configs/appconfig.json
      - SOURCE="environment variable"
    restart: unless-stopped

  secretswithoutapikeyandconfig:
    build: .
    container_name: secretswithoutapikeyandconfig
    image: secrets:latest
    ports:
      - "3002:3000"
    environment:
      - API_KEY_FILE=/run/secrets/apikey.txt
      - CONFIG_FILE=/run/configs/appconfig.json
      - SOURCE=environment variable
    restart: unless-stopped

secrets:
  apikey.txt:
    file: ./apikey.txt

configs:
  appconfig.json:
    file: ./appconfig.json
